server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true

          default-filters:
            - AddResponseHeader=X-Gateway, SkyBooker-Gateway

          routes:

            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**
              filters:
                - AddRequestHeader=X-Forwarded-By, SkyBooker-Gateway

            - id: airline-service-airlines
              uri: http://localhost:8082
              predicates:
                - Path=/airlines/**
              filters:
                - AddRequestHeader=X-Forwarded-By, SkyBooker-Gateway

            - id: airline-service-airports
              uri: http://localhost:8082
              predicates:
                - Path=/airports/**
              filters:
                - AddRequestHeader=X-Forwarded-By, SkyBooker-Gateway

            - id: flight-service
              uri: http://localhost:8083
              predicates:
                - Path=/flights/**
              filters:
                - AddRequestHeader=X-Forwarded-By, SkyBooker-Gateway

            - id: seat-service
              uri: http://localhost:8084
              predicates:
                - Path=/seats/**
              filters:
                - AddRequestHeader=X-Forwarded-By, SkyBooker-Gateway

            - id: passenger-service
              uri: http://localhost:8085
              predicates:
                - Path=/passengers/**
              filters:
                - AddRequestHeader=X-Forwarded-By, SkyBooker-Gateway

            - id: booking-service
              uri: http://localhost:8086
              predicates:
                - Path=/bookings/**
              filters:
                - AddRequestHeader=X-Forwarded-By, SkyBooker-Gateway

            - id: payment-service
              uri: http://localhost:8087
              predicates:
                - Path=/payments/**
              filters:
                - AddRequestHeader=X-Forwarded-By, SkyBooker-Gateway

            - id: notification-service
              uri: http://localhost:8088
              predicates:
                - Path=/notifications/**
              filters:
                - AddRequestHeader=X-Forwarded-By, SkyBooker-Gateway

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health, info

  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.skybooker.gateway: DEBUG