# Server Port
server.port=8083

# Application Name
spring.application.name=flight-service

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/skybooker_flight?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Secret
jwt.secret=${JWT_SECRET}

# Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.packagesToScan=com.skybooker.flight
springdoc.pathsToMatch=/**

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.skybooker=DEBUG